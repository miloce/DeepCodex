name: Build DeepCodex

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-node-package:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2025-vs2026
            name: windows
          - os: macos-15
            name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check src/cli.js
          node --check src/server.js
          node --check src/codex-config.js

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Build standalone app
        run: npm run build:app

      - name: Prepare release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Compress-Archive -Path dist/deepcodex-node/* -DestinationPath dist/release/deepcodex-node-${{ matrix.name }}.zip -Force
          Compress-Archive -Path dist/app/* -DestinationPath dist/release/deepcodex-app-${{ matrix.name }}.zip -Force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepcodex-${{ matrix.name }}
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    name: Upload GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-node-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: deepcodex-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.zip
